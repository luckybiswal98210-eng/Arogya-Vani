<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arogya Vani Health Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .language-selector {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .language-selector label {
            color: white;
            font-size: 14px;
            margin-right: 10px;
            font-weight: bold;
        }

        .language-selector select {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            color: #667eea;
            font-weight: bold;
        }

        .language-selector select:hover {
            background: white;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .audio-controls {
            margin-top: 8px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .audio-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .audio-btn:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .audio-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: scale(1);
        }

        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #userInput {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        #userInput:focus {
            border-color: #667eea;
        }

        .voice-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            font-size: 18px;
        }

        .voice-btn:hover {
            transform: scale(1.1);
        }

        .voice-btn.recording {
            animation: pulse 1s infinite;
            background: #f5576c;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        #sendBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        #sendBtn:hover {
            transform: scale(1.05);
        }

        #sendBtn:active {
            transform: scale(0.95);
        }

        .typing-indicator {
            display: none;
            padding: 10px 18px;
            background: white;
            border-radius: 18px;
            width: fit-content;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .typing-indicator.show {
            display: block;
        }

        .typing-indicator span {
            height: 8px;
            width: 8px;
            background: #667eea;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-10px);
            }
        }

        .welcome-message {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .welcome-message h2 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .status-indicator {
            text-align: center;
            padding: 5px;
            font-size: 12px;
            color: white;
            background: rgba(0, 0, 0, 0.2);
            display: none;
        }

        @media (max-width: 600px) {
            .chat-container {
                height: 100vh;
                border-radius: 0;
            }

            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🏥 Arogya Vani Health Chatbot</h1>
            <p>Your AI Health Assistant - Voice & Text Support</p>
        </div>
        <div class="language-selector">
            <label for="outputLanguage">🌐 Response Language:</label>
            <select id="outputLanguage">
                <option value="en">English</option>
                <option value="hi">हिंदी (Hindi)</option>
                <option value="mr">मराठी (Marathi)</option>
                <option value="ta">தமிழ் (Tamil)</option>
                <option value="bn">বাংলা (Bengali)</option>
                <option value="te">తెలుగు (Telugu)</option>
                <option value="kn">ಕನ್ನಡ (Kannada)</option>
                <option value="gu">ગુજરાતી (Gujarati)</option>
            </select>
        </div>
        <div class="status-indicator" id="statusIndicator"></div>
        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <h2>Welcome! 🙏</h2>
                <p>I'm your health assistant. Describe your symptoms in any language!</p>
                <p style="margin-top: 10px; font-size: 12px;">💬 Type or 🎤 speak your symptoms<br>🔊 Listen to
                    responses with audio playback</p>
            </div>
        </div>
        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <button id="voiceBtn" class="voice-btn" title="Voice Input">🎤</button>
                <input type="text" id="userInput" placeholder="Type or speak your symptoms..." autocomplete="off">
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </div>
    <script src="chatbot-data.js"></script>
    <script src="chatbot-conversation-flows.js"></script>
    <script>
        let selectedLanguage = 'en', isRecording = false, recognition = null, currentUtterance = null, currentButtons = null, isPaused = false;

        // Conversation state management
        let conversationState = {
            stage: 'initial',
            symptom: null,
            duration: null,
            severity: null,
            additionalSymptoms: [],
            responses: []
        };

        const chatMessages = document.getElementById('chatMessages'), userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn'), voiceBtn = document.getElementById('voiceBtn');
        const outputLanguageSelect = document.getElementById('outputLanguage'), statusIndicator = document.getElementById('statusIndicator');

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false; recognition.interimResults = false; recognition.lang = 'en-US';
            recognition.onstart = () => { isRecording = true; voiceBtn.classList.add('recording'); voiceBtn.textContent = '⏹️'; showStatus('🎤 Listening...'); };
            recognition.onresult = (event) => { userInput.value = event.results[0][0].transcript; showStatus('✅ Got it!'); setTimeout(() => hideStatus(), 1000); };
            recognition.onerror = (event) => { console.error('Speech recognition error:', event.error); showStatus('❌ Error: ' + event.error); setTimeout(() => hideStatus(), 2000); };
            recognition.onend = () => { isRecording = false; voiceBtn.classList.remove('recording'); voiceBtn.textContent = '🎤'; };
        } else { voiceBtn.disabled = true; voiceBtn.title = 'Voice input not supported in this browser'; }

        outputLanguageSelect.addEventListener('change', (e) => { selectedLanguage = e.target.value; showStatus(`Language changed to ${e.target.options[e.target.selectedIndex].text}`); setTimeout(() => hideStatus(), 2000); });
        voiceBtn.addEventListener('click', () => { if (!recognition) return; if (isRecording) { recognition.stop(); } else { recognition.start(); } });
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;
            addMessage(message, 'user'); userInput.value = ''; showTypingIndicator();
            setTimeout(() => { const response = getBotResponse(message, selectedLanguage); hideTypingIndicator(); addMessage(response, 'bot', true); }, 500);
        }

        function addMessage(text, sender, enableAudio = false) {
            const messageDiv = document.createElement('div'); messageDiv.className = `message ${sender}`;
            const contentDiv = document.createElement('div'); contentDiv.className = 'message-content'; contentDiv.textContent = text;
            messageDiv.appendChild(contentDiv);

            if (sender === 'bot' && enableAudio && 'speechSynthesis' in window) {
                const audioControls = document.createElement('div'); audioControls.className = 'audio-controls';
                const playBtn = document.createElement('button'); playBtn.className = 'audio-btn'; playBtn.textContent = '🔊 Play';
                const pauseBtn = document.createElement('button'); pauseBtn.className = 'audio-btn'; pauseBtn.textContent = '⏸️ Pause'; pauseBtn.disabled = true;
                const resumeBtn = document.createElement('button'); resumeBtn.className = 'audio-btn'; resumeBtn.textContent = '▶️ Resume'; resumeBtn.disabled = true; resumeBtn.style.display = 'none';
                const stopBtn = document.createElement('button'); stopBtn.className = 'audio-btn'; stopBtn.textContent = '⏹️ Stop'; stopBtn.disabled = true;
                const buttons = { playBtn, pauseBtn, resumeBtn, stopBtn, text };
                playBtn.onclick = () => speakText(buttons); pauseBtn.onclick = () => pauseSpeech(buttons);
                resumeBtn.onclick = () => resumeSpeech(buttons); stopBtn.onclick = () => stopSpeech(buttons);
                audioControls.appendChild(playBtn); audioControls.appendChild(pauseBtn); audioControls.appendChild(resumeBtn); audioControls.appendChild(stopBtn);
                contentDiv.appendChild(audioControls);
            }
            chatMessages.appendChild(messageDiv); chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function getBestVoice(lang) {
            const voices = window.speechSynthesis.getVoices();
            const priorities = {
                'hi-IN': ['Google हिन्दी', 'Microsoft Hemant', 'Lekha', 'Google Hindi'],
                'mr-IN': ['Google मराठी', 'Microsoft Hemant', 'Google Marathi'],
                'ta-IN': ['Google தமிழ்', 'Microsoft Heera', 'Google Tamil'],
                'bn-IN': ['Google বাংলা', 'Microsoft Hemant', 'Google Bengali'],
                'te-IN': ['Google తెలుగు', 'Microsoft Heera', 'Google Telugu'],
                'kn-IN': ['Google ಕನ್ನಡ', 'Microsoft Heera', 'Google Kannada'],
                'gu-IN': ['Google ગુજરાતી', 'Microsoft Hemant', 'Google Gujarati'],
                'en-US': ['Google US English Female', 'Microsoft Zira', 'Samantha', 'Google US English']
            };

            const prefs = priorities[lang] || [];
            for (const pref of prefs) {
                const voice = voices.find(v => v.name.includes(pref));
                if (voice) { console.log('✓ Selected:', voice.name, 'for', lang); return voice; }
            }

            const langCode = lang.split('-')[0];
            const fallback = voices.find(v => v.lang.startsWith(langCode) || v.lang.includes(langCode));
            if (fallback) { console.log('⚠ Fallback:', fallback.name, 'for', lang); return fallback; }

            console.warn('❌ No voice for', lang); return null;
        }

        function speakText(buttons) {
            if (currentUtterance) { window.speechSynthesis.cancel(); if (currentButtons) resetButtons(currentButtons); }

            const voices = window.speechSynthesis.getVoices();
            if (voices.length === 0) { showStatus('⏳ Loading voices...'); setTimeout(() => speakText(buttons), 200); return; }

            const utterance = new SpeechSynthesisUtterance(buttons.text);
            const langCodes = { 'en': 'en-US', 'hi': 'hi-IN', 'mr': 'mr-IN', 'ta': 'ta-IN', 'bn': 'bn-IN', 'te': 'te-IN', 'kn': 'kn-IN', 'gu': 'gu-IN' };
            const langCode = langCodes[selectedLanguage] || 'en-US';

            utterance.lang = langCode;
            const voice = getBestVoice(langCode);
            if (voice) utterance.voice = voice;

            utterance.rate = (selectedLanguage === 'mr' || selectedLanguage === 'gu') ? 0.75 : 0.85;
            utterance.pitch = 1.1;

            utterance.onstart = () => { buttons.playBtn.disabled = true; buttons.pauseBtn.disabled = false; buttons.stopBtn.disabled = false; buttons.resumeBtn.style.display = 'none'; isPaused = false; showStatus('🔊 Playing...'); };
            utterance.onend = () => { resetButtons(buttons); currentUtterance = null; currentButtons = null; hideStatus(); };
            utterance.onerror = (e) => { console.error('Speech error:', e); resetButtons(buttons); currentUtterance = null; showStatus('❌ Audio error'); setTimeout(() => hideStatus(), 3000); };

            currentUtterance = utterance; currentButtons = buttons;
            window.speechSynthesis.speak(utterance);
        }

        function pauseSpeech(buttons) {
            if (window.speechSynthesis.speaking && !isPaused) {
                window.speechSynthesis.pause(); isPaused = true;
                buttons.pauseBtn.disabled = true; buttons.pauseBtn.style.display = 'none';
                buttons.resumeBtn.disabled = false; buttons.resumeBtn.style.display = 'inline-block';
                showStatus('⏸️ Paused');
            }
        }

        function resumeSpeech(buttons) {
            if (isPaused) {
                window.speechSynthesis.resume(); isPaused = false;
                buttons.resumeBtn.disabled = true; buttons.resumeBtn.style.display = 'none';
                buttons.pauseBtn.disabled = false; buttons.pauseBtn.style.display = 'inline-block';
                showStatus('🔊 Playing...');
            }
        }

        function stopSpeech(buttons) { window.speechSynthesis.cancel(); resetButtons(buttons); currentUtterance = null; currentButtons = null; isPaused = false; hideStatus(); }
        function resetButtons(buttons) { buttons.playBtn.disabled = false; buttons.pauseBtn.disabled = true; buttons.pauseBtn.style.display = 'inline-block'; buttons.resumeBtn.disabled = true; buttons.resumeBtn.style.display = 'none'; buttons.stopBtn.disabled = true; isPaused = false; }
        function showStatus(message) { statusIndicator.textContent = message; statusIndicator.style.display = 'block'; }
        function hideStatus() { statusIndicator.style.display = 'none'; }
        function showTypingIndicator() { const indicator = document.createElement('div'); indicator.className = 'message bot'; indicator.id = 'typingIndicator'; const typingDiv = document.createElement('div'); typingDiv.className = 'typing-indicator show'; typingDiv.innerHTML = '<span></span><span></span><span></span>'; indicator.appendChild(typingDiv); chatMessages.appendChild(indicator); chatMessages.scrollTop = chatMessages.scrollHeight; }
        function hideTypingIndicator() { const indicator = document.getElementById('typingIndicator'); if (indicator) indicator.remove(); }
        function getBotResponse(userMessage, outputLang) {
            const detectedLang = detectLanguage(userMessage);
            const normalized = normalizeUserMessage(userMessage);

            if (isGreeting(normalized)) {
                resetConversation();
                return getGreetingResponse(normalized, outputLang);
            }

            // Detect acknowledgment/end phrases
            const ackPhrases = ['ok', 'okay', 'thanks', 'thank you', 'got it', 'understood', 'alright', 'fine', 'good', 'धन्यवाद', 'ठीक है', 'ओके', 'ठीक आहे', 'நன்றி', 'சரி', 'ধন্যবাদ', 'ঠিক আছে', 'ధన్యవాదాలు', 'సరే', 'ಧನ್ಯವಾದಗಳು', 'ಸರಿ', 'આભાર', 'બરાબર'];

            if (ackPhrases.some(p => normalized === p || normalized.includes(p))) {
                const thankYou = {
                    en: '🙏 You\'re welcome! Take care and get well soon. Feel free to ask if you have any other health concerns.',
                    hi: '🙏 स्वागत है! अपना ख्याल रखें। किसी अन्य समस्या के लिए पूछें।',
                    mr: '🙏 स्वागत आहे! स्वतःची काळजी घ्या। इतर समस्येसाठी विचारा।',
                    ta: '🙏 வரவேற்கிறோம்! உங்களை கவனித்துக்கொள்ளுங்கள்.',
                    bn: '🙏 স্বাগতম! নিজের যত্ন নিন।',
                    te: '🙏 స్వాగతం! మిమ్మల్ని జాగ్రత్తగా చూసుకోండి।',
                    kn: '🙏 ಸ್ವಾಗತ! ನಿಮ್ಮನ್ನು ನೋಡಿಕೊಳ್ಳಿ।',
                    gu: '🙏 સ્વાગત છે! તમારી સંભાળ રાખો।'
                };
                resetConversation();
                return thankYou[outputLang] || thankYou.en;
            }

            // Initial stage - detect symptom
            if (conversationState.stage === 'initial') {
                const symptom = findSymptom(userMessage, detectedLang);
                if (symptom && CONVERSATION_FLOWS[symptom]) {
                    conversationState.symptom = symptom;
                    conversationState.stage = 'duration';
                    conversationState.responses.push(userMessage);
                    return CONVERSATION_FLOWS[symptom].questions.duration[outputLang];
                }
                if (symptom) {
                    return getResponse(symptom, outputLang);
                }
                return getOutOfScopeResponse(outputLang);
            }

            // Duration stage
            if (conversationState.stage === 'duration') {
                conversationState.duration = extractDuration(userMessage);
                conversationState.stage = 'severity';
                conversationState.responses.push(userMessage);
                return CONVERSATION_FLOWS[conversationState.symptom].questions.severity[outputLang];
            }

            // Severity stage
            if (conversationState.stage === 'severity') {
                conversationState.severity = extractSeverity(userMessage);
                conversationState.stage = 'additional';
                conversationState.responses.push(userMessage);
                return CONVERSATION_FLOWS[conversationState.symptom].questions.additional[outputLang];
            }

            // Additional symptoms stage - final response
            if (conversationState.stage === 'additional') {
                conversationState.additionalSymptoms = extractAdditionalSymptoms(userMessage);
                conversationState.responses.push(userMessage);
                const finalResponse = generatePersonalizedAdvice(conversationState, outputLang);
                resetConversation();
                return finalResponse;
            }

            return getResponse('general_discomfort', outputLang);
        }

        function normalizeUserMessage(text) {
            return text.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, '').trim();
        }

        function isGreeting(normalized) {
            const greetingPhrases = [
                'hi', 'hii', 'hiii', 'hiiii', 'hello', 'helo', 'helloo', 'hey', 'hy', 'hlo', 'hloo',
                'namaste', 'namaskar', 'good morning', 'good afternoon', 'good evening',
                'नमस्ते', 'नमस्कार', 'हाय', 'हैलो',
                'வணக்கம்', 'ஹலோ',
                'হ্যালো', 'নমস্কার',
                'హలో', 'నమస్తే',
                'ಹಲೋ', 'ನಮಸ್ಕಾರ',
                'હેલો', 'નમસ્તે'
            ];

            return greetingPhrases.some(phrase => normalized === phrase);
        }

        function getGreetingResponse(normalized, language) {
            const echoGreeting = getGreetingEcho(normalized, language);
            const greetingResponses = {
                en: `${echoGreeting}! I am your AI health assistant. How are you today? Please tell me your symptom or health concern, and I will try to help you.`,
                hi: `${echoGreeting}! मैं आपकी AI health assistant हूं। आप आज कैसे हैं? कृपया अपना लक्षण या स्वास्थ्य समस्या बताइए, मैं मदद करने की कोशिश करूंगी।`,
                mr: `${echoGreeting}! मी तुमची AI health assistant आहे. तुम्ही आज कसे आहात? कृपया तुमची लक्षणे किंवा आरोग्य समस्या सांगा, मी मदत करण्याचा प्रयत्न करेन.`,
                ta: `${echoGreeting}! நான் உங்கள் AI health assistant. நீங்கள் இன்று எப்படி இருக்கிறீர்கள்? உங்கள் அறிகுறி அல்லது உடல்நலப் பிரச்சினையை சொல்லுங்கள், நான் உதவ முயற்சிப்பேன்.`,
                bn: `${echoGreeting}! আমি আপনার AI health assistant। আপনি আজ কেমন আছেন? আপনার উপসর্গ বা স্বাস্থ্য সমস্যাটি বলুন, আমি সাহায্য করার চেষ্টা করব।`,
                te: `${echoGreeting}! నేను మీ AI health assistant ని. మీరు ఈ రోజు ఎలా ఉన్నారు? మీ లక్షణం లేదా ఆరోగ్య సమస్యను చెప్పండి, నేను సహాయం చేయడానికి ప్రయత్నిస్తాను.`,
                kn: `${echoGreeting}! ನಾನು ನಿಮ್ಮ AI health assistant. ನೀವು ಇಂದು ಹೇಗಿದ್ದೀರಿ? ನಿಮ್ಮ ಲಕ್ಷಣ ಅಥವಾ ಆರೋಗ್ಯ ಸಮಸ್ಯೆಯನ್ನು ತಿಳಿಸಿ, ನಾನು ಸಹಾಯ ಮಾಡಲು ಪ್ರಯತ್ನಿಸುತ್ತೇನೆ.`,
                gu: `${echoGreeting}! હું તમારી AI health assistant છું. તમે આજે કેમ છો? કૃપા કરીને તમારું લક્ષણ અથવા આરોગ્ય સમસ્યા જણાવો, હું મદદ કરવાનો પ્રયત્ન કરીશ.`
            };

            return greetingResponses[language] || greetingResponses.en;
        }

        function getGreetingEcho(normalized, language) {
            if (language !== 'en') {
                const localizedGreetings = {
                    hi: 'नमस्ते',
                    mr: 'नमस्कार',
                    ta: 'வணக்கம்',
                    bn: 'নমস্কার',
                    te: 'నమస్తే',
                    kn: 'ನಮಸ್ಕಾರ',
                    gu: 'નમસ્તે'
                };

                return localizedGreetings[language] || 'Hello';
            }

            if (normalized.startsWith('hey')) return 'Hey';
            if (normalized.startsWith('hello') || normalized === 'helo' || normalized === 'helloo') return 'Hello';
            return 'Hi';
        }

        function getOutOfScopeResponse(language) {
            const responses = {
                en: "I can help with health-related questions and symptoms only. Please tell me about a symptom, health concern, or medical issue.",
                hi: "मैं केवल स्वास्थ्य से जुड़े सवालों और लक्षणों में मदद कर सकती हूं। कृपया कोई लक्षण या स्वास्थ्य समस्या बताइए।",
                mr: "मी फक्त आरोग्याशी संबंधित प्रश्न आणि लक्षणांमध्ये मदत करू शकते. कृपया तुमची लक्षणे किंवा आरोग्य समस्या सांगा.",
                ta: "நான் உடல்நலம் தொடர்பான கேள்விகள் மற்றும் அறிகுறிகளில் மட்டும் உதவ முடியும். தயவுசெய்து உங்கள் அறிகுறி அல்லது உடல்நலப் பிரச்சினையை சொல்லுங்கள்.",
                bn: "আমি শুধু স্বাস্থ্য-সম্পর্কিত প্রশ্ন ও উপসর্গে সাহায্য করতে পারি। দয়া করে আপনার উপসর্গ বা স্বাস্থ্য সমস্যা বলুন।",
                te: "నేను ఆరోగ్యానికి సంబంధించిన ప్రశ్నలు మరియు లక్షణాల గురించి మాత్రమే సహాయం చేయగలను. దయచేసి మీ లక్షణం లేదా ఆరోగ్య సమస్యను చెప్పండి.",
                kn: "ನಾನು ಆರೋಗ್ಯ ಸಂಬಂಧಿತ ಪ್ರಶ್ನೆಗಳು ಮತ್ತು ಲಕ್ಷಣಗಳಲ್ಲಿ ಮಾತ್ರ ಸಹಾಯ ಮಾಡಬಲ್ಲೆ. ದಯವಿಟ್ಟು ನಿಮ್ಮ ಲಕ್ಷಣ ಅಥವಾ ಆರೋಗ್ಯ ಸಮಸ್ಯೆಯನ್ನು ತಿಳಿಸಿ.",
                gu: "હું ફક્ત આરોગ્ય સંબંધિત પ્રશ્નો અને લક્ષણોમાં જ મદદ કરી શકું છું. કૃપા કરીને તમારું લક્ષણ અથવા આરોગ્ય સમસ્યા જણાવો."
            };

            return responses[language] || responses.en;
        }

        function extractDuration(text) {
            const numbers = text.match(/\d+/);
            return numbers ? numbers[0] + ' days' : 'a few days';
        }

        function extractSeverity(text) {
            const lower = text.toLowerCase();
            if (SEVERITY_PATTERNS.mild.some(p => lower.includes(p))) return 'mild';
            if (SEVERITY_PATTERNS.severe.some(p => lower.includes(p))) return 'severe';
            if (SEVERITY_PATTERNS.moderate.some(p => lower.includes(p))) return 'moderate';
            return 'moderate';
        }

        function extractAdditionalSymptoms(text) {
            const symptoms = [];
            const lower = text.toLowerCase();
            if (lower.includes('headache') || lower.includes('सिरदर्द')) symptoms.push('headache');
            if (lower.includes('fever') || lower.includes('बुखार')) symptoms.push('fever');
            if (lower.includes('cough') || lower.includes('खांसी')) symptoms.push('cough');
            return symptoms;
        }

        function generatePersonalizedAdvice(state, lang) {
            const baseAdvice = getResponse(state.symptom, lang);
            const durationText = {
                en: `You've had ${state.symptom.replace('_', ' ')} for ${state.duration} with ${state.severity} severity.`,
                hi: `आपको ${state.duration} से ${state.severity} ${state.symptom} है।`,
                mr: `तुम्हाला ${state.duration} पासून ${state.severity} ${state.symptom} आहे।`
            };

            const prefix = durationText[lang] || durationText.en;
            let advice = `${prefix}\n\n${baseAdvice}`;

            if (state.severity === 'severe' || (state.duration && parseInt(state.duration) > 5)) {
                const urgentText = {
                    en: '\n\n⚠️ IMPORTANT: Please consult a doctor immediately as your symptoms are severe or prolonged.',
                    hi: '\n\n⚠️ महत्वपूर्ण: कृपया तुरंत डॉक्टर से मिलें क्योंकि आपके लक्षण गंभीर या लंबे समय के हैं।',
                    mr: '\n\n⚠️ महत्त्वाचे: कृपया ताबडतोब डॉक्टरांना भेटा कारण तुमची लक्षणे गंभीर किंवा दीर्घकाळ आहेत।'
                };
                advice += urgentText[lang] || urgentText.en;
            }

            // Add thank you message
            const thankYouText = {
                en: '\n\n🙏 Thank you for using Arogya Vani! Take care and get well soon. Feel free to ask if you have any other health concerns.',
                hi: '\n\n🙏 आरोग्य वाणी का उपयोग करने के लिए धन्यवाद! अपना ख्याल रखें और जल्द ठीक हो जाएं। किसी अन्य स्वास्थ्य समस्या के लिए बेझिझक पूछें।',
                mr: '\n\n🙏 आरोग्य वाणी वापरल्याबद्दल धन्यवाद! स्वतःची काळजी घ्या आणि लवकर बरे व्हा. इतर कोणत्याही आरोग्य समस्येसाठी विचारा।',
                ta: '\n\n🙏 ஆரோக்ய வாணியைப் பயன்படுத்தியதற்கு நன்றி! உங்களை கவனித்துக்கொள்ளுங்கள், விரைவில் குணமடையுங்கள். வேறு ஏதேனும் உடல்நலப் பிரச்சினைகள் இருந்தால் கேளுங்கள்.',
                bn: '\n\n🙏 আরোগ্য বাণী ব্যবহার করার জন্য ধন্যবাদ! নিজের যত্ন নিন এবং শীঘ্রই সুস্থ হন। অন্য কোনো স্বাস্থ্য সমস্যা থাকলে জিজ্ঞাসা করুন।',
                te: '\n\n🙏 ఆరోగ్య వాణిని ఉపయోగించినందుకు ధన్యవాదాలు! మిమ్మల్ని జాగ్రత్తగా చూసుకోండి మరియు త్వరగా కోలుకోండి. ఇతర ఆరోగ్య సమస్యలు ఉంటే అడగండి.',
                kn: '\n\n🙏 ಆರೋಗ್ಯ ವಾಣಿ ಬಳಸಿದ್ದಕ್ಕಾಗಿ ಧನ್ಯವಾದಗಳು! ನಿಮ್ಮನ್ನು ನೋಡಿಕೊಳ್ಳಿ ಮತ್ತು ಬೇಗ ಗುಣಮುಖರಾಗಿ. ಇತರ ಆರೋಗ್ಯ ಸಮಸ್ಯೆಗಳಿದ್ದರೆ ಕೇಳಿ.',
                gu: '\n\n🙏 આરોગ્ય વાણીનો ઉપયોગ કરવા બદલ આભાર! તમારી સંભાળ રાખો અને જલ્દી સાજા થાઓ. અન્ય કોઈ આરોગ્ય સમસ્યા હોય તો પૂછો.'
            };

            advice += thankYouText[lang] || thankYouText.en;

            return advice;
        }

        function resetConversation() {
            conversationState = {
                stage: 'initial',
                symptom: null,
                duration: null,
                severity: null,
                additionalSymptoms: [],
                responses: []
            };
        }
        function detectLanguage(text) { if (/[\u0900-\u097F]/.test(text)) return 'hi'; if (/[\u0980-\u09FF]/.test(text)) return 'bn'; if (/[\u0B80-\u0BFF]/.test(text)) return 'ta'; if (/[\u0C00-\u0C7F]/.test(text)) return 'te'; if (/[\u0C80-\u0CFF]/.test(text)) return 'kn'; if (/[\u0A80-\u0AFF]/.test(text)) return 'gu'; return 'en'; }
        function findSymptom(userInput, language) { const normalized = userInput.toLowerCase().trim(); for (const lang in INPUT_KEYWORDS) { for (const [keyword, symptom] of Object.entries(INPUT_KEYWORDS[lang])) { if (normalized.includes(keyword.toLowerCase())) { return symptom; } } } for (const symptom of Object.keys(RESPONSES_EN)) { if (normalized.includes(symptom.replace('_', ' ')) || normalized.includes(symptom)) { return symptom; } } return null; }
        function getResponse(symptom, language) { if (language === 'en' || !MULTILINGUAL_RESPONSES[language]) { return RESPONSES_EN[symptom] || RESPONSES_EN['general_discomfort']; } const langResponses = MULTILINGUAL_RESPONSES[language] || {}; return langResponses[symptom] || RESPONSES_EN[symptom] || RESPONSES_EN['general_discomfort']; }

        window.addEventListener('load', () => { userInput.focus(); window.speechSynthesis.getVoices(); });
        if (window.speechSynthesis) { window.speechSynthesis.onvoiceschanged = () => { console.log('✓ Voices loaded:', window.speechSynthesis.getVoices().length); }; }
    </script>
</body>
